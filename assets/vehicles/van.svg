<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" role="presentation" focusable="false">
<!--
  CA-Fahrzeugsilhouette · Kastenwagen
  Eigenzeichnung, markenneutral: keine Nachbildung eines konkreten Modells,
  keine Herstellermerkmale. Navy trägt die Struktur, Silber die Flächen,
  Orange markiert ausschließlich die Ladefläche.
  Gemeinsames Raster aller Typen: Kabine links, Ladung rechts, Radaufstand y≈88.
-->
<g fill="none" stroke="#0D1B2A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ein durchgehender Körper: Fahrerhaus und Laderaum sind eins -->
  <path d="M14 76 V50 L30 34 H144 a4 4 0 0 1 4 4 V76 a4 4 0 0 1-4 4 H18 a4 4 0 0 1-4-4 Z" fill="#EAEEF2"/>
  <!-- Frontscheibe folgt der Nase, bleibt innerhalb der Kontur -->
  <path d="M33 39 H48 V51 H21 Z" fill="#C2CCD6" stroke-width="2"/>
  <path d="M54 37 V79" stroke-width="1.8"/>
  <path d="M60 68 H142" stroke="#E87722" stroke-width="2.6"/>
  <circle cx="46" cy="80" r="11" fill="#EAEEF2"/>
  <circle cx="46" cy="80" r="4" fill="#C2CCD6" stroke-width="2"/>
  <circle cx="122" cy="80" r="11" fill="#EAEEF2"/>
  <circle cx="122" cy="80" r="4" fill="#C2CCD6" stroke-width="2"/>
</g>
</svg>
