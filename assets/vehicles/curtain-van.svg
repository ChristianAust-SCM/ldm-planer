<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" role="presentation" focusable="false">
<!--
  CA-Fahrzeugsilhouette · Transporter mit Planenaufbau
  Eigenzeichnung, markenneutral: keine Nachbildung eines konkreten Modells,
  keine Herstellermerkmale. Navy trägt die Struktur, Silber die Flächen,
  Orange markiert ausschließlich die Ladefläche.
  Gemeinsames Raster aller Typen: Kabine links, Ladung rechts, Radaufstand y≈88.
-->
<g fill="none" stroke="#0D1B2A" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
  <!-- Getrenntes Fahrerhaus, dahinter Pritsche mit Planenaufbau auf Spriegeln -->
  <path d="M12 74 V50 L26 36 H48 V74 a4 4 0 0 1-4 4 H16 a4 4 0 0 1-4-4 Z" fill="#EAEEF2"/>
  <path d="M28 41 H42 V52 H18 Z" fill="#C2CCD6" stroke-width="2"/>
  <!-- Planenaufbau, Dach etwas über der Kabine -->
  <path d="M54 68 V34 a3 3 0 0 1 3-3 H145 a3 3 0 0 1 3 3 V68 Z" fill="#EAEEF2"/>
  <path d="M74 33 V66 M94 33 V66 M114 33 V66 M132 33 V66" stroke-width="1.6"/>
  <!-- Pritschenboden -->
  <path d="M50 68 H152 V74 H50 Z" fill="#C2CCD6"/>
  <path d="M56 68 H146" stroke="#E87722" stroke-width="2.6"/>
  <circle cx="40" cy="80" r="10" fill="#EAEEF2"/>
  <circle cx="40" cy="80" r="3.6" fill="#C2CCD6" stroke-width="2"/>
  <circle cx="118" cy="80" r="10" fill="#EAEEF2"/>
  <circle cx="118" cy="80" r="3.6" fill="#C2CCD6" stroke-width="2"/>
</g>
</svg>
